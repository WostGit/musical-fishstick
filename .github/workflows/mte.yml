name: Avrea MTE4 Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  mte4:
    name: MTE4 on Avrea M5 Max
    runs-on: avrea-macos-26-8-vcpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System information
        shell: bash
        run: |
          set -euo pipefail

          echo "=== macOS ==="
          sw_vers

          echo
          echo "=== Architecture ==="
          uname -m
          uname -a

          echo
          echo "=== Hardware ==="
          system_profiler SPHardwareDataType

          echo
          echo "=== Model ==="
          sysctl hw.model || true

          echo
          echo "=== CPU ==="
          sysctl machdep.cpu.brand_string 2>/dev/null || true

          echo
          echo "=== Virtualization / hypervisor hints ==="
          sysctl -a 2>/dev/null \
            | grep -Ei 'virtual|hypervisor|hv_' \
            || true

      - name: Check MTE capabilities
        id: mte
        shell: bash
        run: |
          set -euo pipefail

          FEATURES=(
            FEAT_MTE
            FEAT_MTE2
            FEAT_MTE3
            FEAT_MTE4
            FEAT_MTE_CANONICAL_TAGS
            FEAT_MTE_NO_ADDRESS_TAGS
            FEAT_MTE_STORE_ONLY
          )

          echo "=== MTE feature status ==="

          for feature in "${FEATURES[@]}"; do
            key="hw.optional.arm.${feature}"
            value="$(sysctl -n "$key" 2>/dev/null || echo unavailable)"

            printf "%-45s %s\n" "$key" "$value"
          done

          echo
          MTE4="$(sysctl -n hw.optional.arm.FEAT_MTE4 2>/dev/null || echo unavailable)"

          echo "mte4=$MTE4" >> "$GITHUB_OUTPUT"

          if [ "$MTE4" = "1" ]; then
            echo "MTE4_SUPPORTED=true" >> "$GITHUB_ENV"
          else
            echo "MTE4_SUPPORTED=false" >> "$GITHUB_ENV"
          fi

      - name: Check related MTE4 features
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Related MTE4 capabilities ==="

          for feature in \
            FEAT_MTE_CANONICAL_TAGS \
            FEAT_MTE_NO_ADDRESS_TAGS \
            FEAT_MTE_STORE_ONLY
          do
            key="hw.optional.arm.${feature}"
            value="$(sysctl -n "$key" 2>/dev/null || echo unavailable)"

            printf "%-45s %s\n" "$key" "$value"
          done

      - name: Check Clang target features
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Clang ==="
          clang --version

          echo
          echo "=== Default ARM/MTE macros ==="

          clang -dM -E -x c /dev/null \
            | grep -Ei 'ARM_FEATURE.*MEMORY_TAGGING|MTE' \
            || echo "No MTE-related predefined macros enabled by default."

      - name: Dump ARM feature sysctls
        shell: bash
        run: |
          set -euo pipefail

          sysctl -a 2>/dev/null \
            | grep -E '^hw\.optional\.arm\.' \
            | sort \
            | tee arm-features.txt

      - name: Upload ARM feature report
        uses: actions/upload-artifact@v4
        with:
          name: avrea-arm-features
          path: arm-features.txt

      - name: MTE4 result
        shell: bash
        run: |
          echo "=== Final result ==="

          if [ "${MTE4_SUPPORTED}" = "true" ]; then
            echo "PASS: FEAT_MTE4 is exposed and enabled."
          else
            echo "FAIL: FEAT_MTE4 is not exposed/enabled."
            echo
            echo "Avrea value:"
            sysctl hw.optional.arm.FEAT_MTE4 2>/dev/null || true
            exit 1
          fi
